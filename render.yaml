services:
  - type: web
    name: groundtruth-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: https://groundtruth-zeta-flax.vercel.app
      - key: MAX_QUESTIONS_PER_QUIZ
        value: "12"
      - key: QUESTION_TIME_LIMIT_SECONDS
        value: "20"
